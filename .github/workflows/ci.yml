name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: docker compose config
        env:
          XRAYWATCH_CONTROL_URL: https://control.example.com
          XRAYWATCH_TRUST_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - run: docker build --build-arg VERSION="$(cat VERSION)" -t xraywatch-node-agent:test .
